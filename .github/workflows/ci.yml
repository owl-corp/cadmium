name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml
    with:
      elixir-version: "1.19.5"
      otp-version: "28.5.0.5"

  test:
    uses: ./.github/workflows/_test.yml
    with:
      elixir-version: "1.19.5"
      otp-version: "28.5.0.5"

  docker:
    # Only push images on main; always requires lint + test to pass first.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    uses: ./.github/workflows/_docker.yml
    permissions:
      contents: read
      packages: write
