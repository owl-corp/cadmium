{{- if not .Values.secret.existingSecret }}
{{- /*
Precedence per key: explicit value > value already in the cluster (so generated secrets
survive `helm upgrade`) > freshly generated. `lookup` returns nothing under
`helm template` / `--dry-run=client`, so those render new random values every time.
*/}}
{{- $name := include "cadmium.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $existing "data") | default dict }}
{{- $secretKeyBase := .Values.secret.secretKeyBase | b64enc }}
{{- if not $secretKeyBase }}
{{- $secretKeyBase = (get $data "SECRET_KEY_BASE") | default (randAlphaNum 64 | b64enc) }}
{{- end }}
{{- $cookie := .Values.secret.erlangCookie | b64enc }}
{{- if not $cookie }}
{{- $cookie = (get $data "RELEASE_COOKIE") | default (randAlphaNum 48 | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cadmium.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY_BASE: {{ $secretKeyBase | quote }}
  RELEASE_COOKIE: {{ $cookie | quote }}
{{- end }}
