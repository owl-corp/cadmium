# Headless Service: its A records are the agent pod IPs, which libcluster
# (Cluster.Strategy.Kubernetes.DNS) polls to connect cadmium@<pod ip> nodes.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cadmium.headlessServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cadmium.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  # Agents must find each other before (and regardless of whether) they are Ready.
  publishNotReadyAddresses: true
  selector:
    {{- include "cadmium.selectorLabels" . | nindent 4 }}
  ports:
    - name: epmd
      port: 4369
      targetPort: epmd
      protocol: TCP
    - name: dist
      port: {{ .Values.distribution.port }}
      targetPort: dist
      protocol: TCP
---
# Dashboard Service. Every agent serves the same cluster-wide dashboard, so any
# backend will do.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cadmium.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cadmium.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cadmium.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
