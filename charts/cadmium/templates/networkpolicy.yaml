{{- if .Values.networkPolicy.enabled }}
# Ingress-only policy (egress to the API server and DNS is left alone):
#   - epmd + Erlang distribution: agent pods only
#   - dashboard: only the peers in .Values.networkPolicy.dashboardFrom
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cadmium.agentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cadmium.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cadmium.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cadmium.selectorLabels" . | nindent 14 }}
      ports:
        - port: epmd
          protocol: TCP
        - port: dist
          protocol: TCP
    {{- with .Values.networkPolicy.dashboardFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
{{- end }}
